name: Random Cron
on:
  workflow_run:
    workflows: ["刷步数"]
    types:
      - completed
jobs:
  repo-sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：https://www.jianshu.com/p/bb82b3ad1d11,需要repo和workflow权限
      - name: random cron
        run: |
          echo "===== before ====="
          grep -n "cron:" .github/workflows/run.yml
          M=$((RANDOM % 59))
          awk -v m="$M" '{ if ($0 ~ /^[[:space:]]*-[[:space:]]*cron:/) { sub(/[0-9]+/, m) } print }' .github/workflows/run.yml > run.yml.tmp && mv run.yml.tmp .github/workflows/run.yml
          echo "===== after (new minute: $M) ====="
          grep -n "cron:" .github/workflows/run.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "random cron."
          git push origin master
